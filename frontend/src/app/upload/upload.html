<div class="min-h-screen bg-gradient-to-br from-slate-950 via-pink-950/40 to-slate-950 text-white p-6">

  <div class="max-w-5xl mx-auto">

    <div class="text-center mb-12">

      <div class="inline-block p-5 rounded-3xl bg-white/5 backdrop-blur-md border border-pink-500/10 shadow-2xl shadow-pink-500/5">

        <h1 class="text-5xl font-black bg-gradient-to-r from-rose-400 via-pink-400 to-fuchsia-400 bg-clip-text text-transparent">
          Upload Center
        </h1>

        <p class="text-pink-200/60 mt-3 text-lg">
          Gerencie seus arquivos com estilo
        </p>

      </div>

    </div>

    <div class="bg-white/5 border border-pink-500/10 backdrop-blur-xl rounded-3xl p-8 shadow-2xl shadow-pink-500/5">

      <div class="flex flex-col gap-6">

        <label
          class="relative border-2 border-dashed border-pink-500/30 rounded-2xl p-10 text-center cursor-pointer hover:border-pink-400 transition-all duration-300 bg-slate-950/60 group">

          <input
            type="file"
            (change)="selecionarArquivo($event)"
            class="hidden"
          />

          <div class="space-y-3">

            <div class="text-6xl filter drop-shadow-[0_0_15px_rgba(244,114,182,0.3)]">
              🌸
            </div>

            <h2 class="text-2xl font-bold text-pink-100 group-hover:text-pink-300 transition-colors">
              Arraste seu arquivo aqui
            </h2>

            <p class="text-slate-400">
              ou clique para selecionar
            </p>

            <p class="text-sm text-pink-400/50">
              JPG, PNG, TIFF • Máximo 5MB
            </p>

          </div>

        </label>

        <button
          (click)="enviarArquivo()"
          [disabled]="carregando"
          class="bg-gradient-to-r from-rose-400 via-pink-500 to-fuchsia-500 hover:scale-[1.02] active:scale-100 transition-all duration-300 p-4 rounded-2xl font-bold text-lg shadow-lg shadow-pink-500/20 disabled:opacity-50 text-slate-950"
        >

          <span *ngIf="!carregando" class="flex items-center justify-center gap-2">
            ✨ Enviar Arquivo
          </span>

          <span *ngIf="carregando">
            Enviando...
          </span>

        </button>

        <div
          *ngIf="mensagem"
          class="bg-pink-950/30 border border-pink-500/20 p-4 rounded-2xl text-center text-lg text-pink-300"
        >
          {{ mensagem }}
        </div>

      </div>

    </div>

    <div class="mt-12">

      <div class="flex items-center justify-between mb-6">

        <h2 class="text-3xl font-black bg-gradient-to-r from-pink-200 to-white bg-clip-text text-transparent">
          Arquivos Enviados
        </h2>

        <div class="bg-pink-600/80 backdrop-blur-md px-4 py-2 rounded-full text-sm font-bold shadow-lg shadow-pink-500/10 text-white">
          {{ arquivos.length }} arquivos
        </div>

      </div>

      <div
        *ngIf="arquivos.length === 0"
        class="bg-white/5 border border-pink-500/10 rounded-3xl p-10 text-center text-slate-400"
      >

        <div class="text-6xl mb-4 opacity-60">
          ✨
        </div>

        <p class="text-xl text-pink-200/40">
          Nenhum arquivo enviado ainda
        </p>

      </div>

      <div class="grid gap-5">

        <div
          *ngFor="let arquivo of arquivos"
          class="group bg-white/5 border border-pink-500/10 hover:border-pink-500/40 transition-all duration-300 p-5 rounded-3xl flex items-center justify-between backdrop-blur-lg hover:scale-[1.01]"
        >

          <div class="flex items-center gap-5">

            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-rose-400 to-pink-600 flex items-center justify-center text-3xl shadow-lg shadow-pink-500/20">
              🎀
            </div>

            <div>

              <h3 class="font-bold text-lg break-all text-pink-50">
                {{ arquivo.filename }}
              </h3>

              <div class="flex gap-4 mt-1 text-sm text-pink-200/50">

                <span>
                  {{ arquivo.size }} bytes
                </span>

                <span>
                  {{ arquivo.criado | date:'short' }}
                </span>

              </div>

            </div>

          </div>

          <button
            (click)="deletar(arquivo.filename)"
            class="bg-rose-500/10 hover:bg-rose-600 text-rose-400 hover:text-slate-950 transition-all duration-300 px-5 py-3 rounded-2xl font-bold text-sm border border-rose-500/20 hover:border-transparent"
          >
            🗑 Excluir
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
