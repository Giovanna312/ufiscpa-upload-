<div class="max-w-6xl mx-auto p-6 min-h-screen bg-gray-50 text-gray-800">
  
  <header class="bg-white rounded-2xl shadow-sm p-6 mb-8 border border-gray-100">
    <div class="mb-6">
      <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Galeria de Fotos</h1>
      <p class="text-gray-500 mt-1">Faça upload de novas imagens e veja a listagem do servidor em tempo real.</p>
    </div>
    
    <div class="flex items-center justify-center w-full">
      <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-gray-300 border-dashed rounded-xl cursor-pointer bg-gray-50 hover:bg-indigo-50/50 hover:border-indigo-400 transition-all duration-200 group">
        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4">
          <svg class="w-10 h-10 mb-3 text-gray-400 group-hover:text-indigo-500 transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <p class="mb-1 text-sm text-gray-600">
            <span class="font-semibold text-indigo-600 group-hover:underline">Clique para selecionar</span> ou arraste a imagem aqui
          </p>
          <p class="text-xs text-gray-400">Formatos aceitos: PNG, JPG ou WEBP</p>
        </div>
        <input type="file" class="hidden" accept="image/*" (change)="onFileSelected($event)" [disabled]="loading()" />
      </label>
    </div>
  </header>

  <div *ngIf="loading()" class="flex justify-center items-center py-6">
    <div class="animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
    <span class="ml-3 text-sm font-semibold text-indigo-600 animate-pulse">Carregando dados...</span>
  </div>

  <main *ngIf="fotos().length > 0; else listaVazia">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      
      <div *ngFor="let foto of fotos()" class="bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-md border border-gray-200 transition-all duration-300 group">
        <div class="relative aspect-video w-full overflow-hidden bg-gray-100">
          <img 
            [src]="foto.url" 
            [alt]="foto.titulo || 'Foto'" 
            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out" />
        </div>
        
        <div class="p-3 bg-white border-t border-gray-50" *ngIf="foto.id || foto.titulo">
          <p class="text-xs font-medium text-gray-400">ID: #{{ foto.id }}</p>
          <p class="text-sm font-semibold text-gray-700 truncate mt-0.5" *ngIf="foto.titulo">{{ foto.titulo }}</p>
        </div>
      </div>

    </div>
  </main>

  <ng-template #listaVazia>
    <div *ngIf="!loading()" class="text-center py-16 bg-white rounded-2xl border border-gray-100 shadow-sm max-w-md mx-auto mt-12">
      <p class="text-4xl mb-3">📸</p>
      <h3 class="text-lg font-bold text-gray-800">Nenhuma foto no servidor</h3>
      <p class="text-sm text-gray-400 mt-1 max-w-xs mx-auto">Faça o upload do seu primeiro arquivo usando a área acima!</p>
    </div>
  </ng-template>

</div>
